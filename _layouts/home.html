<!doctype html>
<html lang="en">
  {% include head.html %}
  <body>
    {% include facebook_pixel.html %}

    <div id="root"></div>

    <!-- React from CDN. JSX is transpiled ahead of time by `npm run build:js`
         (see package.json) so the browser never loads @babel/standalone. -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

    <!-- Site data, rendered server-side by Jekyll from _data/ and _config.yml -->
    <script src="{{ '/assets/js/data.js' | relative_url }}"></script>

    <!-- Calendar (.ics) helper — plain JS, no build step -->
    <script src="{{ '/assets/js/ics.js' | relative_url }}"></script>

    <!-- Add-to-calendar routing (used for the "Subscribe to all events" link) -->
    <script src="{{ '/assets/js/addcal.js' | relative_url }}"></script>

    <!-- React components, precompiled from the .jsx sources -->
    <script src="{{ '/assets/js/theme.js'    | relative_url }}"></script>
    <script src="{{ '/assets/js/nav.js'      | relative_url }}"></script>
    <script src="{{ '/assets/js/hero.js'     | relative_url }}"></script>
    <script src="{{ '/assets/js/sections.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/tweaks.js'   | relative_url }}"></script>
    <script src="{{ '/assets/js/app.js'      | relative_url }}"></script>
  </body>
</html>
