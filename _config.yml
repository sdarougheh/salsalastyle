# Site settings — Salsa LA-Style Copenhagen
title: "Salsa LA-Style"
description: "Teaching LA-style Salsa in Copenhagen"
url: "https://www.salsalastyle.dk"

# Build settings
markdown: kramdown
timezone: Europe/Copenhagen
future: true   # publish future-dated event pages

# Events collection — one file per event under _events/, auto-published to
# /events/<name>/ with its own page. See _layouts/event.html.
collections:
  events:
    output: true
    permalink: /events/:name/

# Default social-share image for pages that don't set their own.
og_image: "/assets/images/logo.png"

# Exclude legacy / working files from the build
exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - .dockerignore
  - .travis.yml
  - README.md
  - uploads
  - "Salsa LA-Style Home.html"
  - _vendor

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"

# Season info (edit in one place)
season:
  name: "Autumn 2026"
  dates: "September 2 – October 28"
  # early_bird_until: "April 19th"   # uncomment to show early bird banner
  # --- used to generate the recurring "Add to calendar" invites for classes ---
  first_class: "2026-09-02"          # date of the first Wednesday (ISO)
  weeks: 9                           # total occurrences including any holiday
  exdates:                           # dates to skip (no class)
    - "2026-10-14"                   # week 42, autumn holidays

# "Bring a friend" discount — Beginners class only.
# Shown as an option on /beginner and used by /registration_friend.html.
# `base` is the regular Single Class price from _data/pricing.yml — keep the
# two in sync if pricing changes. Set `enabled: false` to hide the option
# everywhere (the page keeps working for anyone holding a direct link).
friend_discount:
  enabled: true
  percent: 20
  base: 800                    # DKK per person, before the discount
  class: "Beginners Autumn"    # value written to the registrations sheet

# MobilePay payment boxes. Edit here whenever the box changes.
# `classes` is used by /payments and the class success page;
# `workshops` is used by the workshop success page. They can point at the
# same box (current default) or be split if needed.
# `social` is the separate "100% Crossbody" box for door entry at the
# crossbody socials, kept apart from class fees so the two don't mix in
# the MobilePay statement. It is used by the body of `_events/crossbody-*.md`.
#
# CAUTION: the `calendar_description` block in each `_events/*.md` front
# matter also names the box, and Jekyll does NOT run Liquid in front matter,
# so that copy cannot read these values. If you change `social` below, also
# grep `_events/` for the old box code and update those blocks by hand.
mobilepay:
  classes:
    box: "9629ZT"
    url: "https://qr.mobilepay.dk/box/8d2d6b24-d6ef-4f9d-b34f-3e7262adde95/pay-in"
  workshops:
    box: "9629ZT"
    url: "https://qr.mobilepay.dk/box/8d2d6b24-d6ef-4f9d-b34f-3e7262adde95/pay-in"
  social:
    box: "2244AK"
    url: "https://qr.mobilepay.dk/box/0e87a242-413a-4d41-8b99-0025af193ddc/pay-in"
