# Pricing table for the season. `save_regular` / `save_student` optional.
- pkg: "Drop-in"
  meta: "One hour"
  regular: "110 DKK"
  student: "100 DKK"
- pkg: "Single Class"
  meta: "6 weeks · 1 hour/wk"
  regular: "600 DKK"
  student: "510 DKK"
- pkg: "Two Classes"
  meta: "6 weeks · 2 hours/wk"
  regular: "1080 DKK"
  student: "918 DKK"
  save_regular: "18%"
  save_student: "24%"
# "Bring a friend" pair price — Beginners class only. `flat` rows show a single
# price instead of the regular/student split (the pair price is the same for
# everyone, and is lower than the student price). Keep these numbers in sync
# with `friend_discount` in _config.yml.
- pkg: "With a Friend"
  # Hidden unless friend_discount.enabled is true in _config.yml.
  pair: true
  meta: "Beginners only · 6 weeks · two people"
  flat: "960 DKK"
  flat_label: "Two people"
  flat_meta: "480 DKK each"
  save_flat: "20%"
  note: >
    <strong>Beginners class only.</strong> You and your friend sign up together
    in one go and pay 960 DKK in a single payment — <a href="/registration_friend">register as a pair</a>.
