# Pricing table for the season. `save_regular` / `save_student` optional.
- pkg: "Drop-in"
  meta: "One hour"
  regular: "110 DKK"
  student: "100 DKK"
- pkg: "Single Class"
  meta: "8 weeks · 1 hour/wk"
  regular: "800 DKK"
  student: "680 DKK"
- pkg: "Two Classes"
  meta: "8 weeks · 2 hours/wk"
  regular: "1440 DKK"
